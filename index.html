<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kyadah Has Closed</title>
<meta name="description" content="kyadah has been wound down. To reach Sami Ammous, find him on LinkedIn.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&family=Nunito+Sans:wght@400&display=swap" rel="stylesheet">
<style>
:root{--charcoal:#2D3047;--mid:#454865;--red:#D63A5A;--red-pale:#fdf0f3;--red-light:#f0c0ca;--link:#bf2f4d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--red-pale);color:var(--charcoal);font-family:'Nunito Sans',system-ui,-apple-system,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;border-top:6px solid var(--red)}
header{background:#fff;border-bottom:1px solid var(--red-light)}
.inner{width:100%;max-width:1040px;margin:0 auto;padding:20px 16px}
header img{display:block;width:140px;height:auto}
main{flex:1;display:flex;align-items:center;width:100%;max-width:1040px;margin:0 auto;padding:32px 16px}
.card{max-width:600px;background:#fff;border:1px solid var(--red-light);border-left:4px solid var(--red);border-radius:12px;padding:clamp(24px,5vw,48px)}
h1{font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0 0 20px}
h1::after{content:"";display:block;width:56px;height:4px;border-radius:2px;background:var(--red);margin-top:18px}
p{font-size:18px;color:var(--mid);margin:0}
a{color:var(--link);text-underline-offset:3px}
a:hover,a:focus-visible{color:var(--charcoal)}
footer{background:var(--charcoal);color:#c9cbe0;font-size:14px}
footer .inner{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer span{font-family:'Nunito',system-ui,sans-serif;font-weight:700;color:#fff}
footer a{color:#fff}
</style>
</head>
<body>
<header><div class="inner"><img src="/logo.png" alt="kyadah" width="140"></div></header>
<main>
<div class="card">
<h1>kyadah Has Closed</h1>
<p>Thank you to everyone who worked with us or supported the company. kyadah has since been wound down. If you would like to reach Sami Ammous, the best place is <a href="https://www.linkedin.com/in/sami-ammous/">LinkedIn</a>.</p>
</div>
</main>
<footer><div class="inner"><span>kyadah</span><a href="https://www.linkedin.com/in/sami-ammous/">Sami Ammous on LinkedIn</a></div></footer>
</body>
</html>
